services:
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://incidenthub:demo-only-change-me@db:5432/incidenthub
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mcp-server:
    build: ./mcp-server
    environment:
      INCIDENTHUB_API_URL: http://api:8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidenthub
      POSTGRES_USER: incidenthub
      POSTGRES_PASSWORD: demo-only-change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidenthub -d incidenthub"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
