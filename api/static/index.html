<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IncidentHub · Operations</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#26364e;--muted:#91a2bb;--text:#edf3fc;--red:#ff9b9b;--green:#58d6a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#172b49 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}main{max-width:1100px;margin:48px auto;padding:0 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.eyebrow{color:#7eb5ff;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700}h1{font-size:32px;margin:4px 0}.muted,.label{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--green);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.card,.incident{background:linear-gradient(145deg,#15233a,var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px}.stat{font-size:28px;font-weight:700;margin-top:8px}.label{font-size:12px}.incident{display:flex;justify-content:space-between;gap:24px;margin:12px 0}.incident h3{margin:0 0 5px;font-size:16px}.tag{font-size:11px;border-radius:5px;padding:4px 7px;background:#39252c;color:var(--red);height:max-content}@media(max-width:650px){.stats{grid-template-columns:1fr}.top,.incident{align-items:flex-start;flex-direction:column}}
</style></head><body><main>
<header class="top"><div><div class="eyebrow">Operations center</div><h1>IncidentHub</h1><div class="muted">Incident response · Synthetic training environment</div></div><span class="pill" id="health">Checking services…</span></header>
<section class="stats"><div class="card"><div class="label">OPEN INCIDENTS</div><div class="stat" id="open">—</div></div><div class="card"><div class="label">CHECKOUT SERVICE</div><div class="stat" id="latency">—</div></div><div class="card"><div class="label">EVENT PIPELINE</div><div class="stat">Active</div></div></section>
<div class="eyebrow">Active incident queue</div><h2>Incidents</h2><section id="incidents"></section></main>
<script>
async function refresh(){try{const [health,incidents,summary]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/incidents').then(r=>r.json()),fetch('/api/checkout/summary').then(r=>r.json())]);document.querySelector('#health').textContent='● All systems operational';document.querySelector('#open').textContent=incidents.filter(i=>i.status!=='resolved').length;document.querySelector('#latency').textContent=summary.open_incidents+' tracked';document.querySelector('#incidents').innerHTML=incidents.map(i=>'<article class="incident"><div><h3>'+i.title+'</h3><div class="muted">'+i.id+' · '+i.service+' · '+i.summary+'</div></div><span class="tag">'+i.severity+' · '+i.status+'</span></article>').join('')}catch(e){document.querySelector('#health').textContent='● Service unavailable'}}refresh();setInterval(refresh,15000);
</script></body></html>
